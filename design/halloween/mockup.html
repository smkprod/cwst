<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0}html{overflow-x:clip}
:root{--or:#ff8a2a;--or2:#ffb347;--vi:#8b5cf6;--txt:#fbf5ff;--mut:#b7a6cf}
body{width:390px;min-height:844px;overflow-x:clip;position:relative;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--txt);
 background:radial-gradient(90% 55% at 78% 4%,rgba(255,170,70,.28),transparent 60%),radial-gradient(80% 50% at 0% 30%,rgba(139,92,246,.30),transparent 65%),linear-gradient(180deg,#1d0b33 0%,#120722 45%,#0a0414 100%)}
.stars,.embers{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6}
.embers i{position:absolute;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#ffd27a,#ff7a1a 60%,transparent 70%);box-shadow:0 0 8px #ff8a2a;opacity:.85}
.moon{position:absolute;right:26px;top:22px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6da,#ffd27a 50%,#e08a2c 100%);box-shadow:0 0 50px 12px rgba(255,180,80,.35),0 0 120px 40px rgba(255,140,40,.15)}
.moon::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 60%,rgba(160,80,20,.35) 0 9%,transparent 10%),radial-gradient(circle at 40% 70%,rgba(160,80,20,.28) 0 7%,transparent 8%),radial-gradient(circle at 55% 30%,rgba(160,80,20,.22) 0 6%,transparent 7%)}
.fog{position:absolute;left:0;right:0;bottom:70px;height:220px;background:radial-gradient(closest-side,rgba(190,160,255,.16),transparent);filter:blur(18px);pointer-events:none}
.wrap{position:relative;padding:16px 14px 100px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;padding:2px 2px 4px}
.top b{font-size:22px;font-weight:900;letter-spacing:-.4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-or{background:linear-gradient(135deg,rgba(255,138,42,.28),rgba(255,138,42,.12));color:#ffc387;border:1px solid rgba(255,160,70,.35)}
.p-live{background:linear-gradient(135deg,#ff4d3a,#c2185b);color:#fff;box-shadow:0 0 16px rgba(255,77,58,.55)}
.p-vi{background:rgba(139,92,246,.22);color:#d6c4ff;border:1px solid rgba(160,120,255,.3)}
.p-gr{background:rgba(110,230,140,.15);color:#9df0b0;border:1px solid rgba(110,230,140,.3)}
.glass{position:relative;border-radius:22px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.glass.rim{border-color:rgba(255,150,60,.28);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,150,60,.08),inset 0 1px 0 rgba(255,200,140,.12)}
.h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.h .t{font-size:17px;font-weight:900;letter-spacing:-.2px}.h .a{margin-left:auto;font-size:12px;color:var(--mut)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.ico img{width:118%;height:118%;object-fit:contain}
.io{background:linear-gradient(135deg,#ff9c3a,#e2531a);box-shadow:0 6px 18px rgba(255,120,40,.45)}
.iv{background:linear-gradient(135deg,#9d6bff,#5b2bc4);box-shadow:0 6px 18px rgba(139,92,246,.45)}
.ig{background:linear-gradient(135deg,#59d98a,#1f8f55);box-shadow:0 6px 18px rgba(60,200,120,.4)}
.muted{color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#e2531a,#ff9c3a 60%,#ffe08a);box-shadow:0 0 14px rgba(255,150,50,.8)}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.row+.row{margin-top:7px}.row b{flex:1;font-size:15px}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#2a1400;flex-shrink:0}
.n1{background:linear-gradient(135deg,#ffe9a8,#f2a922);box-shadow:0 0 12px rgba(255,200,80,.5)}.n2{background:linear-gradient(135deg,#f5f7fc,#9aa6bd)}.n3{background:linear-gradient(135deg,#ffc89a,#b8692e)}
.pts{font-weight:900;color:#ffc387;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.pts img{width:18px;height:18px;object-fit:contain}
.hero{position:relative;border-radius:28px;overflow:hidden;padding:20px 18px 18px;min-height:210px;
 background:radial-gradient(70% 90% at 85% 40%,rgba(255,140,40,.55),transparent 60%),linear-gradient(150deg,#3a1458 0%,#1d0b33 55%,#120722 100%);
 border:1px solid rgba(255,170,80,.3);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,170,.15)}
.hero h1{font-size:30px;line-height:1.05;font-weight:950;letter-spacing:-.8px;background:linear-gradient(95deg,#fff1cf 0%,#ffbf6b 45%,#ff6a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,140,40,.25)}
.hero p{font-size:14px;line-height:1.4;color:#ead9ff;margin-top:8px;max-width:190px}
.hero>:not(img){position:relative;z-index:2}
.hero .art{position:absolute;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,140,40,.35))}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border:none;border-radius:18px;font-size:17px;font-weight:900;color:#fff;
 background:linear-gradient(110deg,#ff9c3a 0%,#e2531a 45%,#8b3bd6 100%);box-shadow:0 12px 30px rgba(255,110,40,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.cta::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.cta img{width:26px;height:26px;object-fit:contain}
.tabbar{position:absolute;z-index:5;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-around;padding:8px 6px;border-radius:24px;
 background:rgba(20,9,34,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tab{display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#8d7aa8}
.tab i{width:44px;height:30px;border-radius:12px;display:grid;place-items:center}
.tab img{width:28px;height:28px;object-fit:contain}
.tab.on{color:#fff}.tab.on i{background:linear-gradient(135deg,#ff9c3a,#e2531a);box-shadow:0 4px 16px rgba(255,120,40,.55)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{padding:12px 6px;border-radius:16px;text-align:center;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.st b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}.st small{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.coll{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 60%,rgba(255,140,40,.28),rgba(0,0,0,.25) 70%);border:1px solid rgba(255,170,80,.35)}
.slot img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(255,120,30,.45))}
.slot.no{background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.12)}
.slot.no img{filter:brightness(0) opacity(.35)}
.slot .k{position:absolute;right:5px;bottom:3px;font-size:10px;font-weight:900;color:#ffd9a8}
.rw{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.rw+.rw{margin-top:8px}
.rw .pic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,150,60,.3),rgba(0,0,0,.2) 70%);overflow:hidden;flex-shrink:0}
.rw .pic img{width:100%;height:100%;object-fit:contain}
.rw .tx{flex:1}.rw .tx b{display:block;font-size:14.5px}.rw .tx span{font-size:12px;color:var(--mut)}
.timer{display:flex;gap:8px;margin-top:14px}
.tm{width:56px;padding:9px 0;border-radius:14px;text-align:center;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.tm b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}.tm small{font-size:10px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 11px;border-radius:12px;font-size:12.5px;font-weight:800;background:rgba(110,230,140,.1);border:1px solid rgba(110,230,140,.35);color:#c9f7d4}
.overlay{position:fixed;z-index:9;inset:0;background:rgba(6,2,12,.7);backdrop-filter:blur(5px);display:grid;place-items:center;padding:22px}
.pop{position:relative;width:100%;border-radius:30px;padding:30px 20px 22px;text-align:center;overflow:hidden;
 background:radial-gradient(80% 60% at 50% 25%,rgba(255,140,40,.5),transparent 70%),linear-gradient(170deg,#3d1660,#160828);border:1px solid rgba(255,180,90,.4);box-shadow:0 0 80px rgba(255,120,40,.35),0 30px 60px rgba(0,0,0,.6)}
.rays{position:absolute;left:50%;top:150px;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(from 0deg,rgba(255,190,90,.16) 0deg 8deg,transparent 8deg 22deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 60%)}
.spark{position:absolute;width:6px;height:6px;background:#ffe3a1;border-radius:50%;box-shadow:0 0 12px #ffb347}
.bar.red i{background:linear-gradient(90deg,#6d0717,#e0283a 60%,#ff8a6a);box-shadow:0 0 14px rgba(255,50,60,.8)}
.p-red{background:rgba(255,60,70,.16);color:#ffb0b0;border:1px solid rgba(255,80,90,.35)}
.ir{background:linear-gradient(135deg,#ff4d5a,#8a0f22);box-shadow:0 6px 18px rgba(255,50,70,.45)}
.feat{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:left}
.feat+.feat{margin-top:8px}.feat .pic{width:48px;height:48px;flex-shrink:0;display:grid;place-items:center}.feat .pic img{max-width:100%;max-height:100%;object-fit:contain}
.feat b{display:block;font-size:14.5px}.feat span{font-size:12.5px;color:var(--mut)}
.dmg{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,60,70,.08);border:1px solid rgba(255,80,90,.18);font-weight:800;font-size:13.5px}
.dmg+.dmg{margin-top:6px}.dmg span:last-child{color:#ff9c9c}
</style></head><body>
<div class="stars" id="stars"></div><div class="moon"></div><div class="fog"></div><div class="embers" id="embers"></div>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabs"></nav>
<script>
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
document.getElementById('stars').innerHTML=Array.from({length:40},()=>`<i style="left:${rnd()*390}px;top:${rnd()*360}px;opacity:${.2+rnd()*.6};transform:scale(${.5+rnd()})"></i>`).join('');
document.getElementById('embers').innerHTML=Array.from({length:22},()=>`<i style="left:${rnd()*390}px;top:${200+rnd()*600}px;transform:scale(${.4+rnd()*.9});opacity:${.3+rnd()*.6}"></i>`).join('');
const I=(n,s='')=>`<img src="assets/${n}.webp" style="${s}">`;
const ic={clan:'<path d="M4 21V10l2-1V5h2v2h2V5h4v2h2V5h2v4l2 1v11M4 21h16"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',hall:'<path d="M3 21h18M4 10h16M12 3 3 8h18l-9-5Z"/>',more:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'};
const sv=p=>`<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function tabs(on){document.getElementById('tabs').innerHTML=[['clan','Клан'],['me','Я'],['hw','Хэллоуин'],['hall','Аллея'],['more','Ещё']].map(([k,l])=>`<div class="tab ${k===on?'on':''}"><i>${k==='hw'?I('pumpkin'):sv(ic[k])}</i>${l}</div>`).join('')}
const s=new URLSearchParams(location.search).get('s')||'1';const app=document.getElementById('app');
const P=(sz=18)=>I('pumpkin',`width:${sz}px;height:${sz}px;object-fit:contain`);
if(s==='1'){tabs('clan');app.innerHTML=`
<div class="top"><b>Полночные Волки</b></div>
${I('ghost','position:absolute;left:228px;top:6px;width:62px;transform:rotate(8deg);opacity:.95;filter:drop-shadow(0 0 16px rgba(255,230,200,.45))')}
<div class="hero" style="min-height:190px">
 <span class="pill p-or">${P(16)} до 1 ноября</span>
 <h1 style="margin-top:12px">Ночь<br>тыкв</h1>
 <p style="max-width:180px">13 тыкв спрятаны в боте. Найди все и стань «Тыквенным королём»</p>
 ${I('cat','position:absolute;right:-14px;bottom:-12px;width:172px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(255,140,40,.35))')}
</div>
<div class="glass rim"><div class="h"><div class="ico io">${I('pumpkin')}</div><div><div class="t">Охота на тыквы</div><div class="muted">Найдено 7 из 13 · +3 сегодня</div></div></div><div class="bar"><i style="width:54%"></i></div></div>
<div class="stats" style="position:relative">${I('pumpkin','position:absolute;left:-8px;top:-14px;width:34px;transform:rotate(-14deg);filter:drop-shadow(0 0 12px rgba(255,150,40,.95))')}<div class="st"><b>24 300</b><small>медали</small></div><div class="st"><b>38/200</b><small>колод</small></div><div class="st"><b>12</b><small>активных</small></div></div>
<div class="glass" style="margin-top:14px">
 ${I('skel','position:absolute;right:4px;top:-34px;width:86px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))')}
 <div class="h"><div class="ico iv">${I('hat')}</div><div class="t">Гонка недели</div></div>
 <div class="row"><span class="num n1">1</span><b>Полночные Волки</b><span class="pts">6 800</span></div>
 <div class="row"><span class="num n2">2</span><b>Ronin Clan</b><span class="pts">6 410</span></div>
 <div class="row"><span class="num n3">3</span><b>Phantom Shadows</b><span class="pts">5 990</span></div>
</div>
`}
if(s==='2'){tabs('hw');app.innerHTML=`
<div class="hero" style="min-height:226px">
 <div style="display:flex;gap:8px"><span class="pill p-live">● LIVE</span><span class="pill p-or">до 1 ноября</span></div>
 <h1 style="margin-top:14px">Охота<br>на тыквы</h1>
 <p style="max-width:165px">Тыквы прячутся по разделам бота. Каждый день новые.</p>
 ${I('pumpkin','position:absolute;right:-22px;top:44px;width:180px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(255,140,40,.6))')}
 ${I('hat','position:absolute;right:40px;top:-2px;width:104px;transform:rotate(-12deg);filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))')}
 <div style="position:relative;margin-top:18px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:7px"><span>Найдено 7 / 13</span><span style="color:#ffc387">+3 сегодня</span></div><div class="bar"><i style="width:54%"></i></div></div>
</div>
<div class="glass rim"><div class="h"><div class="ico io">${I('pumpkin')}</div><div class="t">Коллекция</div><span class="a">7 из 13</span></div>
 <div class="coll">${Array.from({length:10},(_,i)=>`<div class="slot ${i<7?'':'no'}">${I('pumpkin')}${i<7?`<span class="k">${i+1}</span>`:''}</div>`).join('')}</div></div>
<div class="glass" style="display:flex;align-items:center;gap:12px;padding:14px 14px 14px 10px;background:linear-gradient(120deg,rgba(255,240,225,.10),rgba(139,92,246,.10));border-color:rgba(255,235,210,.22)">
 ${I('ghost','width:78px;height:76px;object-fit:contain;flex-shrink:0;margin:-14px 0 -10px;filter:drop-shadow(0 0 18px rgba(255,230,200,.45))')}
 <div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:15.5px">Подсказка призрака</b><span class="pill p-or" style="padding:3px 8px;font-size:11px">новая</span></div>
 <div class="muted" style="margin-top:4px;line-height:1.35;color:#e2d4f7">«Одна тыква спит там, где считают кубки лиги 1×1…»</div></div></div>
<div class="glass">
 ${I('spider','position:absolute;right:18px;top:4px;width:78px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))')}
 <div class="h"><div class="ico iv">${I('hat')}</div><div class="t">Награды</div></div>
 <div class="rw"><div class="pic">${I('hat')}</div><div class="tx"><b>Шляпа ведьмы</b><span>5 тыкв · рамка у ника</span></div><span class="pill p-gr">есть</span></div>
 <div class="rw"><div class="pic">${I('cat')}</div><div class="tx"><b>Чёрный кот</b><span>10 тыкв · значок в профиле</span></div><span class="pill p-vi">ещё 3</span></div>
 <div class="rw"><div class="pic">${I('skel')}</div><div class="tx"><b>Тыквенный король</b><span>13 тыкв · редкий, виден всем</span></div><span class="pill p-or">редкий</span></div>
</div>`}
if(s==='3'){tabs('me');app.innerHTML=`<div class="top"><b>Мои бои</b></div><div class="glass" style="height:150px"></div><div class="glass" style="height:220px"></div><div class="glass" style="height:160px"></div>`;
document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="pop"><div class="rays"></div>
 ${[[40,90],[300,60],[20,190],[332,170],[160,24]].map(([x,y])=>`<span class="spark" style="left:${x}px;top:${y}px"></span>`).join('')}
 <div style="position:relative">${I('pumpkin','display:block;margin:0 auto;width:190px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6)) drop-shadow(0 0 50px rgba(255,140,40,.8))')}
 <div class="pill p-or" style="margin-top:6px;background:rgba(40,12,50,.75);color:#ffd09a">№ 8 из 13</div>
 <h1 style="font-size:30px;font-weight:950;margin-top:10px;background:linear-gradient(95deg,#fff1cf,#ffbf6b,#ff6a3a);-webkit-background-clip:text;background-clip:text;color:transparent">Тыква найдена!</h1>
 <p class="muted" style="font-size:14.5px;margin-top:6px;color:#e6d6fb">Пряталась в истории боёв</p>
 <div style="display:flex;align-items:center;gap:10px;margin:16px 4px 16px;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.3);text-align:left">
  <div style="width:46px;height:46px">${I('cat','width:46px;height:46px;object-fit:contain')}</div>
  <div style="flex:1"><b style="font-size:14px">Ещё 2 до «Чёрного кота»</b><div class="bar" style="margin-top:7px"><i style="width:80%"></i></div></div></div>
 <button class="cta">${I('pumpkin')} Забрать</button>
 <div class="muted" style="margin-top:12px">Поделиться находкой в чат клана</div></div></div></div>`)}
if(s==='4'){tabs('hw');app.innerHTML=`
<div class="hero" style="min-height:250px;background:radial-gradient(70% 90% at 85% 45%,rgba(120,255,140,.28),transparent 60%),radial-gradient(60% 60% at 80% 80%,rgba(255,140,40,.35),transparent 60%),linear-gradient(150deg,#1d2a3a 0%,#1d0b33 55%,#120722 100%);border-color:rgba(140,255,160,.28)">
 <div style="display:flex;gap:8px"><span class="pill p-gr">Челлендж</span><span class="pill p-or">Pass Royale</span></div>
 <h1 style="margin-top:14px;background:linear-gradient(95deg,#eaffde,#9df0b0 45%,#ffbf6b);-webkit-background-clip:text;background-clip:text;color:transparent">Ночь<br>скелетов</h1>
