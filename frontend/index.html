<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Clan War Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Диагностика чёрного экрана: показываем JS-ошибки прямо на странице
      window.addEventListener('error', function (e) {
        var box = document.createElement('pre');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;padding:12px;font-size:11px;white-space:pre-wrap;margin:0;';
        box.textContent = '⚠️ JS error: ' + (e.message || e.type) +
          (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
        document.body.appendChild(box);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var box = document.createElement('pre');
        box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#92400e;color:#fff;padding:12px;font-size:11px;white-space:pre-wrap;margin:0;';
        box.textContent = '⚠️ Promise rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
        document.body.appendChild(box);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
