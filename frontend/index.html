<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Clanify</title>
    <link rel="icon" href="/clanify-logo.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* Заставка ДО загрузки бандла: между открытием мини-аппа и первым кадром
         React иначе виден пустой экран. Стили инлайновые намеренно — внешний
         CSS к этому моменту ещё не приехал. Убирается в main.tsx. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 100;
        background: radial-gradient(circle at 50% 42%, #16203a, #05070c 68%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      }
      #boot-splash img { width: min(58vw, 230px); height: auto; }
      #boot-splash .boot-track {
        width: min(62vw, 220px); height: 3px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
      }
      #boot-splash .boot-fill {
        width: 40%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, transparent, #5aa9ff, #9c6bff, transparent);
        animation: bootSweep 1.3s ease-in-out infinite;
      }
      /* Хэллоуин: тыквенный логотип и тёплый фон, пока идёт ивент (см. скрипт ниже) */
      html[data-hw] #boot-splash { background: radial-gradient(circle at 50% 42%, #3a1606, #070205 68%); }
      html[data-hw] #boot-splash img { width: min(74vw, 290px); }
      html[data-hw] #boot-splash .boot-fill { background: linear-gradient(90deg, transparent, #ffb347, #ff6a1a, transparent); }
      @keyframes bootSweep {
        from { transform: translateX(-120%); }
        to { transform: translateX(320%); }
      }
    </style>
    <script>
      // Диагностика чёрного экрана: показываем JS-ошибки прямо на странице
      window.addEventListener('error', function (e) {
        var box = document.createElement('pre');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;padding:12px;font-size:11px;white-space:pre-wrap;margin:0;';
        box.textContent = '⚠️ JS error: ' + (e.message || e.type) +
          (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
        document.body.appendChild(box);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var box = document.createElement('pre');
        box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#92400e;color:#fff;padding:12px;font-size:11px;white-space:pre-wrap;margin:0;';
        box.textContent = '⚠️ Promise rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
        document.body.appendChild(box);
      });
    </script>
  </head>
  <body>
    <div id="boot-splash">
      <img id="boot-logo" alt="Clanify" />
      <div class="boot-track"><div class="boot-fill"></div></div>
    </div>
    <script>
      // Логотип выбираем до загрузки картинки: в Хэллоуин (даты боссов из HalloweenUseCase)
      // - тыквенный. Пометка на <html> нужна и заставке React - SplashScreen.
      (function () {
        var now = Date.now();
        var hw = now >= Date.UTC(2026, 9, 18, 21) && now < Date.UTC(2026, 10, 2, 12);
        if (hw) document.documentElement.setAttribute('data-hw', '');
        document.getElementById('boot-logo').src = hw ? '/hw/logo.webp' : '/clanify-logo.png';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
