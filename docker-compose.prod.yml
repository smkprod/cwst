services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clanwar
      POSTGRES_USER: clanwar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18+ требует монтировать /var/lib/postgresql (без /data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clanwar -d clanwar"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://clanwar:${POSTGRES_PASSWORD}@db:5432/clanwar
      CLASH_ROYALE_API_TOKEN: ${CLASH_ROYALE_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://clanwar:${POSTGRES_PASSWORD}@db:5432/clanwar
      CLASH_ROYALE_API_TOKEN: ${CLASH_ROYALE_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy

  # HTTPS-вход: Caddy сам получает и продлевает сертификат Let's Encrypt.
  # Домен вида 165-245-222-154.sslip.io резолвится в IP сервера без покупки домена.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
