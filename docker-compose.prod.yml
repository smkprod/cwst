# Лимит логов: без него json-логи контейнеров растут бесконечно и забивают диск
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    # Лимит памяти: на VPS с 1 ГБ один контейнер не должен съесть всю RAM
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      POSTGRES_DB: clanwar
      POSTGRES_USER: clanwar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18+ требует монтировать /var/lib/postgresql (без /data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clanwar -d clanwar"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Образы собираются в GitHub Actions (.github/workflows/docker-build.yml)
  # и скачиваются с ghcr.io — на VPS с 1 ГБ RAM ничего не компилируется.
  api:
    image: ghcr.io/smkprod/cwst-api:latest
    restart: unless-stopped
    logging: *default-logging
    # .NET сам видит cgroup-лимит и ужимает GC-кучу под него; workstation GC экономит RAM.
    # Плюс запас на отрисовку карточек: Skia держит нативный буфер вне управляемой кучи.
    mem_limit: 384m
    mem_reservation: 160m
    environment:
      DATABASE_URL: postgres://clanwar:${POSTGRES_PASSWORD}@db:5432/clanwar
      CLASH_ROYALE_API_TOKEN: ${CLASH_ROYALE_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DOTNET_gcServer: "0"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/smkprod/cwst-worker:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      DATABASE_URL: postgres://clanwar:${POSTGRES_PASSWORD}@db:5432/clanwar
      CLASH_ROYALE_API_TOKEN: ${CLASH_ROYALE_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Адрес, по которому Telegram скачивает картинки inline-карточек.
      # По умолчанию — тот же домен, что и в Caddyfile: он не секрет, и держать его
      # тут значением по умолчанию проще, чем требовать строку в .env на каждом сервере.
      # ВАЖНО: меняете домен в Caddyfile — поменяйте и здесь, иначе картинки будут
      # запрашиваться со старого адреса. Переопределяется через .env при необходимости.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://165-245-222-154.sslip.io}
      DOTNET_gcServer: "0"
    depends_on:
      db:
        condition: service_healthy

  # HTTPS-вход: Caddy сам получает и продлевает сертификат Let's Encrypt.
  # Домен вида 165-245-222-154.sslip.io резолвится в IP сервера без покупки домена.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    mem_reservation: 32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
