name: CI

# Проверки на каждый PR и перед сборкой образов (docker-build.yml вызывает этот
# workflow и собирает образы, только если всё зелёное). Красный PR в main не мержим.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Нет баз, .env и ключей в репозитории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-repo-safety.sh

  backend:
    name: Бэкенд — сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Сборка
        run: dotnet build backend/ClanWarTracker.sln -c Release -nologo

      - name: Тесты
        run: dotnet test backend/ClanWarTracker.sln -c Release --no-build -nologo --logger "console;verbosity=normal"

  frontend:
    name: Фронтенд — типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # tsc -b ловит и ошибки типов, и пропущенные строки перевода: uk и en
      # объявлены типом ru, так что ключ, забытый в одном из языков, - ошибка сборки
      - name: Типы и сборка
        run: npm run build
