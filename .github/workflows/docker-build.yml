name: Build & push Docker images

# Образы собираются на GitHub и пушатся в ghcr.io —
# VPS с 1 ГБ RAM их только скачивает, никакой компиляции на сервере.
on:
  push:
    branches:
      - main
      - claude/clash-royale-clan-token-f3p6kg
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: backend/Dockerfile.api
          - name: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # :latest обновляется ТОЛЬКО с main — пуш в дев-ветку не перезаписывает
          # продакшн-образ (deploy.sh тянет :latest). С дев-ветки собирается только :sha.
          tags: |
            ghcr.io/smkprod/cwst-${{ matrix.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/smkprod/cwst-{0}:latest', matrix.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/smkprod/cwst
